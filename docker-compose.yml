# Single-command deployment (PRD Section 1).
#
#   docker compose up --build
#
# Brings up Postgres with the pgvector extension and the analyzer API. The API
# waits for the database to pass its healthcheck before starting, so the
# schema creation in the lifespan handler never races the server coming up.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: llmsec
      POSTGRES_PASSWORD: llmsec
      POSTGRES_DB: llmsec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmsec -d llmsec"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      args:
        # Set to 1 for an image with the full detector suite (~2.5 GB extra).
        WITH_DETECTORS: "0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://llmsec:llmsec@db:5432/llmsec
      ENVIRONMENT: docker
      API_KEYS: ${API_KEYS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8000:8000"

volumes:
  pgdata:
